# Reproducible experiment configuration (all numbers in reports are generated from this file + code).
experiment:
  name: graph_vs_rules_v1
  primary_seed: 42
  replication_seeds: [42, 43, 44]       # independent dataset draws
  dataset_version: verifybench_v1.0
  n_submissions: 3000                    # in-distribution (grouped 60/20/20 by identity family)
  n_ood_submissions: 600                 # unseen template T5 (+ unsupported Roman-numeral dates)
  family_size: 4
  bootstrap_resamples: 2000              # cluster bootstrap over identity families
models:
  extractor: deterministic_label_parser/1
  entity_resolver: conservative_two_attribute_link/1
  contradiction_scorer: pair_logreg/1
  calibrators: [isotonic, platt]         # chosen by cross-validated NLL on the calibration split only
evaluation:
  primary_split: test
  ood_split: test_ood
  metrics: [precision, recall, f1, macro_f1, fpr, pr_auc, brier_score, nll, ece, risk_coverage, expected_cost, latency_ms]
